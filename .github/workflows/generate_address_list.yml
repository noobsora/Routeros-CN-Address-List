name: Generate All Address Lists

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Basic Version
        run: python generate_address_list.py

      - name: Run V2 Version
        run: python generate_address_list_v2.py

      - name: Show all output files
        run: |
          echo "Listing all generated files:"
          ls -lh output/
          echo "Checking line counts:"
          wc -l output/*

      - name: Commit and push changes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
           add output/
          
          if ! git diff --cached --quiet; then
            echo "Changes detected, committing both versions..."
            git commit -m "📦 Auto-update all CN lists on $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git HEAD:${{ github.ref_name }}
          else
            echo "No changes detected in any file. Skipping push."
          fi
