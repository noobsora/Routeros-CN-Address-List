name: Generate CN Address List (v2)

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run IP merge script and output info
        id: gen_list
        run: |
          mkdir -p output
          
          start_time=$(date +%s)
          python generate_address_list_v2.py > output.log 2>&1
          exit_code=$?
          cat output.log

          if [ $exit_code -ne 0 ]; then
            echo "❌ Script failed with exit code $exit_code"
            exit $exit_code
          fi

          filesize=$(stat -c%s output/CN_v2.rsc)
          ipv4_before=$(grep "Original IPv4 count:" output.log | awk '{print $NF}')
          ipv6_before=$(grep "Original IPv6 count:" output.log | awk '{print $NF}')
          ipv4_after=$( "Merged IPv4 count:" output.log | awk '{print $NF}')
          ipv6_after=$(grep "Merged IPv6 count:" output.log | awk '{print $NF}')

          end_time=$(date +%s)
          duration=$((end_time - start_time))

          echo "filesize=$filesize" >> $GITHUB_OUTPUT
          echo "ipv4_before=$ipv4_before" >> $GITHUB_OUTPUT
          echo "ipv6_before=$ipv6_before" >> $GITHUB_OUTPUT
          echo "ipv4_after=$ipv4_after" >> $GITHUB_OUTPUT
          echo "ipv6_after=$ipv6_after" >> $GITHUB_OUTPUT
          echo "duration=$duration" >> $GITHUB_OUTPUT

      - name: Commit & Push result
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/
          git diff --quiet && git branch --show-current || (git commit -m "📦 Update CN Address List (v2) at $(date -u '+%Y-%m-%d %H:%M:%S') UTC" && git push https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git HEAD:main)

      - name: Print summary
        run: |
          echo "✅ CN Address List v2 更新成功"
          echo "📄 文件大小: ${{ steps.gen_list.outputs.filesize }} 字节"
          echo "🌐 IPv4: ${{ steps.gen_list.outputs.ipv4_before }} → ${{ steps.gen_list.outputs.ipv4_after }}"
          echo "🌐 IPv6: ${{ steps.gen_list.outputs.ipv6_before }} → ${{ steps.gen_list.outputs.ipv6_after }}"
          echo "⏱️ 用时: ${{ steps.gen_list.outputs.duration }} 秒"
